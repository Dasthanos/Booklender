<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация сотрудника</title>
    <style>
        body {
            max-width: 420px;
            margin: 50px auto;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #222;
        }

        label {
            display: block;
            margin: 16px 0 6px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
        }

        button {
            margin-top: 22px;
            padding: 10px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h1>Регистрация сотрудника</h1>

<form action="/register" method="post">
    <label for="email">Email — идентификатор</label>
    <input type="email" id="email" name="email" required>

    <label for="fullName">Имя сотрудника</label>
    <input type="text" id="fullName" name="fullName" required>

    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" required>

    <button type="submit">Зарегистрироваться</button>
</form>

<p><a href="/login">Уже зарегистрированы? Войти</a></p>
</body>
</html>
